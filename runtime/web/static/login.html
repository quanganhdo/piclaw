<!doctype html>
<html lang="en">
<!--
  login.html – TOTP/WebAuthn authentication page for PiClaw.

  The static shell loads public /auth/options before offering code/passkey
  authentication. Family account controls remain behind the startup gate.

  Served by: channels/web/auth/auth-endpoints.ts.
-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piclaw Login</title>
    <link rel="stylesheet" href="/static/common/dist/login.bundle.css?v=__LOGIN_ASSET_VERSION__" />
  </head>
  <body>
    <div class="card">
      <h1 id="login-title">Sign in to PiClaw</h1>
      <p id="login-description" role="status">Loading sign-in options…</p>
      <button id="passkey-button" type="button" hidden>Sign in with a passkey</button>
      <form id="login-form" hidden>
        <div id="username-field" hidden>
          <label for="username">Account username</label>
          <input id="username" name="username" type="text" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" maxlength="64" disabled />
        </div>
        <label for="code">Authenticator code</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="••••••" maxlength="6" required disabled />
        <button id="verify-button" type="submit" disabled>Verify code</button>
      </form>
      <button id="retry-options" type="button" hidden>Retry loading sign-in options</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </div>
    <script type="module" src="/static/common/dist/login.bundle.js?v=__LOGIN_ASSET_VERSION__"></script>
  </body>
</html>
