name: Integration gate

on:
  workflow_call:
    inputs:
      ref:
        description: Exact immutable Git ref/SHA to validate.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Optional immutable Git ref/SHA to validate; defaults to the dispatch SHA.
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: Full integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fd --version

      - name: Install Playwright browsers
        run: bunx playwright install chromium --only-shell

      - name: Install Playwright system dependencies
        run: sudo env PATH="$PATH" bunx playwright install-deps chromium-headless-shell

      - name: Run full integration suite
        run: make ci-integration
        env:
          PICLAW_DB_IN_MEMORY: "1"
          # Playwright/Docker stages auto-detect availability;
          # skip Docker-based tests in CI for now (no Docker-in-Docker).
          PICLAW_INTEGRATION_SKIP_DOCKER: "1"
